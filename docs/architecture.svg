              <path class="head" d="M0,0 L10,5 L0,10 z"/>
            </marker>
          </defs>

          <text class="z" x="20" y="34">aws-event-driven-orders · eu-west-1 · Terraform</text>
          <rect class="box built" x="20" y="60" width="140" height="56" rx="6"/>
          <text class="t" x="90" y="83" text-anchor="middle">Signed client</text>
          <text class="s" x="90" y="101" text-anchor="middle">SigV4 · Idempotency-Key</text>

          <rect class="box built" x="200" y="60" width="220" height="56" rx="6"/>
          <text class="t" x="310" y="83" text-anchor="middle">API Gateway HTTP API</text>
          <text class="s" x="310" y="101" text-anchor="middle">IAM auth · 25 req/s throttle</text>

          <rect class="box built" x="460" y="60" width="240" height="56" rx="6"/>
          <text class="t" x="580" y="83" text-anchor="middle">Lambda · orders API</text>
          <text class="s" x="580" y="101" text-anchor="middle">Python 3.13 · Powertools</text>

          <rect class="box built" x="740" y="60" width="240" height="74" rx="6"/>
          <text class="t" x="860" y="83" text-anchor="middle">DynamoDB · on-demand</text>
          <text class="s" x="860" y="101" text-anchor="middle">orders · stock · stream (PITR)</text>
          <text class="s" x="860" y="118" text-anchor="middle">idempotency records (TTL)</text>

          <line class="e" x1="160" y1="88" x2="198" y2="88" marker-end="url(#a1)"/>
          <line class="e" x1="420" y1="88" x2="458" y2="88" marker-end="url(#a1)"/>
          <line class="e" x1="700" y1="88" x2="738" y2="88" marker-end="url(#a1)"/>
          <rect class="box built" x="620" y="180" width="360" height="56" rx="6"/>
          <text class="t" x="800" y="203" text-anchor="middle">DynamoDB Streams → EventBridge Pipes</text>
          <text class="s" x="800" y="221" text-anchor="middle">new orders only · failures to events DLQ</text>
