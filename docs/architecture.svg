          <text class="t" x="440" y="203" text-anchor="middle">EventBridge bus · orders</text>
          <text class="s" x="440" y="221" text-anchor="middle">OrderPlaced · OrderConfirmed · rule DLQ</text>
          <line class="e" x1="620" y1="208" x2="582" y2="208" marker-end="url(#a1)"/>
          <rect class="zone" x="20" y="280" width="590" height="170" rx="10"/>
          <text class="z" x="36" y="301">Step Functions saga</text>
          <rect class="box built" x="40" y="316" width="160" height="50" rx="6"/>
          <text class="t" x="120" y="337" text-anchor="middle">Reserve stock</text>
          <text class="s" x="120" y="354" text-anchor="middle">conditional write</text>
          <rect class="box built" x="230" y="316" width="160" height="50" rx="6"/>
          <text class="t" x="310" y="337" text-anchor="middle">Charge payment</text>
          <text class="s" x="310" y="354" text-anchor="middle">simulated · retried 3×</text>
          <rect class="box built" x="420" y="316" width="170" height="50" rx="6"/>
          <text class="t" x="505" y="337" text-anchor="middle">Confirm order</text>
          <text class="s" x="505" y="354" text-anchor="middle">emits OrderConfirmed</text>
          <line class="e" x1="200" y1="341" x2="228" y2="341" marker-end="url(#a1)"/>
          <line class="e" x1="390" y1="341" x2="418" y2="341" marker-end="url(#a1)"/>
          <rect class="box built" x="40" y="386" width="160" height="50" rx="6"/>
          <text class="t" x="120" y="407" text-anchor="middle">Release stock</text>
          <text class="s" x="120" y="424" text-anchor="middle">compensation</text>
          <path class="e comp" d="M310,366 L310,411 L202,411" marker-end="url(#a1)"/>
          <text class="el" x="318" y="404">payment fails</text>

          <line class="e" x1="380" y1="236" x2="380" y2="278" marker-end="url(#a1)"/>
          <text class="el" x="387" y="262">rule: OrderPlaced</text>
          <rect class="zone" x="640" y="280" width="340" height="170" rx="10"/>
          <text class="z" x="656" y="301">Notification consumer</text>
          <rect class="box built" x="660" y="316" width="140" height="50" rx="6"/>
          <text class="t" x="730" y="337" text-anchor="middle">SQS queue</text>
          <text class="s" x="730" y="354" text-anchor="middle">3 tries</text>
          <rect class="box built" x="820" y="316" width="140" height="50" rx="6"/>
          <text class="t" x="890" y="337" text-anchor="middle">Lambda</text>
          <text class="s" x="890" y="354" text-anchor="middle">partial batch</text>
          <line class="e" x1="800" y1="341" x2="818" y2="341" marker-end="url(#a1)"/>
          <rect class="box built" x="660" y="386" width="140" height="50" rx="6"/>
          <text class="t" x="730" y="407" text-anchor="middle">Dead-letter queue</text>
          <text class="s" x="730" y="424" text-anchor="middle">alarm on depth</text>
          <rect class="box built" x="820" y="386" width="140" height="50" rx="6"/>
          <text class="t" x="890" y="407" text-anchor="middle">Redrive script</text>
          <text class="s" x="890" y="424" text-anchor="middle">DLQ → queue</text>
          <line class="e" x1="730" y1="366" x2="730" y2="384" marker-end="url(#a1)"/>

          <path class="e" d="M540,236 L540,258 L730,258 L730,314" marker-end="url(#a1)"/>
          <text class="el" x="560" y="252">rule: OrderConfirmed</text>
          <rect class="box built" x="20" y="480" width="470" height="56" rx="6"/>
          <text class="t" x="255" y="503" text-anchor="middle">CloudWatch · X-Ray · SNS</text>
          <text class="s" x="255" y="521" text-anchor="middle">8 alarms → email · dashboard · latency metric · traces</text>
          <rect class="box built" x="510" y="480" width="470" height="56" rx="6"/>
          <text class="t" x="745" y="503" text-anchor="middle">Fault switch and post-deploy tests</text>
          <text class="s" x="745" y="521" text-anchor="middle">SSM failure rates, no redeploy · smoke + e2e after every deploy</text>
          <text class="z" x="20" y="580">CI/CD · GitHub OIDC, no stored keys</text>
          <rect class="box built" x="20" y="592" width="230" height="56" rx="6"/>
          <text class="t" x="135" y="615" text-anchor="middle">GitHub Actions</text>
          <text class="s" x="135" y="633" text-anchor="middle">lint · plan · deploy · test dev</text>
          <rect class="box built" x="290" y="592" width="220" height="56" rx="6"/>
          <text class="t" x="400" y="615" text-anchor="middle">STS · plan, deploy, test roles</text>
          <text class="s" x="400" y="633" text-anchor="middle">existing OIDC provider</text>
          <rect class="box built" x="550" y="592" width="200" height="56" rx="6"/>
          <text class="t" x="650" y="615" text-anchor="middle">Terraform</text>
          <text class="s" x="650" y="633" text-anchor="middle">plan on PRs · apply on main</text>
          <rect class="box built" x="790" y="592" width="190" height="56" rx="6"/>
          <text class="t" x="885" y="615" text-anchor="middle">S3 state bucket</text>
