<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" width="1000" height="670" role="img" aria-labelledby="title desc">
  <title id="title">aws-event-driven-orders architecture</title>
  <desc id="desc">A signed client calls an IAM-auth API Gateway HTTP API; a Lambda writes the order to DynamoDB. The table's stream feeds an EventBridge Pipe that publishes OrderPlaced to a custom bus. A rule starts a Step Functions saga (reserve stock, charge payment, confirm, release stock on payment failure). OrderConfirmed goes to an SQS queue read by a notifier Lambda, with a dead-letter queue and a redrive script. CloudWatch, X-Ray and SNS cover alarms and traces; a Parameter Store fault switch and post-deploy tests check the failure paths. GitHub Actions deploys with Terraform through OIDC roles, with state in S3.</desc>
  <style>
    .bg { fill: #f4f6f8; }
    .box { fill: #ffffff; stroke: #5b6774; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .box.built { fill: #e2f3ef; stroke: #0b7a68; stroke-dasharray: none; stroke-width: 1.6; }
    .zone { fill: none; stroke: #c7d0da; stroke-width: 1.2; }
    .t { fill: #16202b; font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
    .s, .el { fill: #5b6774; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 11px; }
    .z { fill: #5b6774; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
    .e { stroke: #16202b; stroke-width: 1.3; fill: none; }
    .e.comp { stroke-dasharray: 4 3; }
    .head { fill: #16202b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f151b; }
      .box { fill: #161e26; stroke: #93a0ad; }
      .box.built { fill: #143029; stroke: #45c7ae; }
      .zone { stroke: #2e3a46; }
      .t { fill: #e3e9ef; }
      .s, .el, .z { fill: #93a0ad; }
      .e { stroke: #e3e9ef; }
      .head { fill: #e3e9ef; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="670"/>
