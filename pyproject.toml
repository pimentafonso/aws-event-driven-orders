[project]
name = "aws-event-driven-orders"
version = "0.1.0"
description = "Lambda handlers for event-driven order processing on AWS."
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
# GET requests publish no business metric; Powertools warns about that.
filterwarnings = ["ignore:No application metrics to publish:UserWarning"]
